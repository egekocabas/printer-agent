[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "printer-agent"
version = "0.1.0"
description = "A generic HTTP interface to ESC/POS thermal printers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ege Kocabas" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-escpos[usb]==3.1",
  "Pillow==12.3.0",
  "pillow-heif==1.5.0",
  "prometheus-client==0.26.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.4",
]

[project.urls]
Repository = "https://github.com/egekocabas/printer-agent"
Issues = "https://github.com/egekocabas/printer-agent/issues"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/printer_agent"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["printer_agent"]
